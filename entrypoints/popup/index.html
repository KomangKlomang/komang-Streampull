<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>StreamGrab</title>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <span>StreamGrab</span>
      </div>
      <div class="bar-actions">
        <button id="btn-studio" class="ghost icon-btn" type="button" aria-label="Buka StreamGrab Studio" title="Studio"></button>
        <button id="btn-scan" class="ghost icon-btn" type="button" aria-label="Pindai ulang halaman" title="Pindai"></button>
        <button id="btn-play" class="ghost icon-btn" type="button" aria-label="Putar video" title="Putar"></button>
        <button id="btn-clear" class="ghost icon-btn" type="button" aria-label="Kosongkan daftar" title="Bersihkan"></button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Navigasi panel">
      <button class="tab active" data-tab="main" type="button" role="tab" aria-selected="true"></button>
      <button class="tab" data-tab="history" type="button" role="tab" aria-selected="false"></button>
      <button class="tab" data-tab="settings" type="button" role="tab" aria-selected="false"></button>
    </nav>

    <div id="panel-main" class="panel">
      <p id="page-host" class="page-host"></p>

      <section id="jobs-wrap" class="jobs hidden" aria-label="Unduhan aktif">
        <div class="jobs-head">
          <h2><span class="jobs-head-icon" aria-hidden="true"></span> Unduhan aktif</h2>
          <button id="btn-clear-jobs" class="ghost small icon-btn" type="button" aria-label="Bersihkan unduhan selesai" title="Bersihkan selesai"></button>
        </div>
        <div id="jobs" class="list"></div>
      </section>

      <section id="preview" class="preview"></section>
      <section id="media" class="list" aria-live="polite"></section>
      <section id="diag" class="diag"></section>
    </div>

    <div id="panel-history" class="panel hidden" role="tabpanel">
      <div class="panel-head">
        <h2><span class="history-head-icon" aria-hidden="true"></span> Riwayat unduhan</h2>
        <button id="btn-clear-history" class="ghost small icon-btn" type="button" aria-label="Kosongkan riwayat" title="Kosongkan"></button>
      </div>
      <div id="history" class="list"></div>
    </div>

    <div id="panel-settings" class="panel hidden" role="tabpanel">
      <div class="settings">
        <label class="field">
          <span class="field-label">Folder simpan otomatis</span>
          <input id="set-folder" type="text" placeholder="StreamGrab" spellcheck="false" />
          <span class="field-hint">Subfolder di folder unduhan Chrome. Contoh: <code>Videos/StreamGrab</code>. Dipakai saat simpan otomatis dan sebagai lokasi awal jika dialog Chrome muncul.</span>
        </label>
        <label class="field check">
          <input id="set-ask-save" type="checkbox" />
          <span>Selalu tampilkan dialog simpan (lokasi awal dari folder di atas)</span>
        </label>
        <p id="save-hint" class="save-hint">
          Unduhan dirakit di extension dulu, lalu disimpan otomatis ke folder di atas.
        </p>
        <label class="field">
          <span class="field-label">Koneksi paralel</span>
          <input id="conc" type="number" min="1" max="16" step="1" />
          <span class="field-hint">Batas koneksi paralel per unduhan (1–16).</span>
        </label>
      </div>
    </div>

    <footer class="foot">
      <span class="hint">Unduh → rakit di extension → simpan otomatis ke folder Pengaturan.</span>
      <button id="btn-diag" class="ghost small icon-btn" type="button" aria-label="Diagnostik" title="Diagnostik"></button>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
